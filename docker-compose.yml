services:
  db:
    image: mariadb:latest
    container_name: weather-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: weather_db
      MARIADB_USER: weather_user
      MARIADB_PASSWORD: weather_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: